services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agendavoice}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_root_change_me}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-local_app_change_me}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:-local_migrator_change_me}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./infra/postgres/01-roles.sql:/opt/agendavoice/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agendavoice}"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://agendavoice_app:${APP_DB_PASSWORD:-local_app_change_me}@db:5432/agendavoice
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_ENABLED: "true"
      PUBLIC_APP_URL: http://localhost:5173
      PUBLIC_API_URL: http://localhost:8000
      MIGRATION_DATABASE_URL: postgresql+psycopg://agendavoice_migrator:${MIGRATOR_DB_PASSWORD:-local_migrator_change_me}@db:5432/agendavoice
    command: sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000'
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
    # Mailpit is local-only; inspect messages at http://localhost:8025
    volumes: ["./backend:/app"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    depends_on: [api]
volumes:
  pgdata:
